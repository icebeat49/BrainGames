[versions]
agp                   = "8.9.0"
kotlin                = "2.0.21"
ksp                   = "2.0.21-1.0.28"
coreKtx               = "1.16.0"
activityCompose       = "1.10.1"
composeBom            = "2025.04.01"
navigationCompose     = "2.9.0"
lifecycleViewModel    = "2.9.0"
datastorePrefs        = "1.1.4"
hilt                  = "2.56.1"
hiltNavigationCompose = "1.2.0"
coroutines            = "1.10.2"
appcompat             = "1.7.1"
material              = "1.13.0"
junit                 = "4.13.2"
junitVersion          = "1.3.0"
espressoCore          = "3.7.0"

[libraries]
androidx-core-ktx           = { group = "androidx.core",               name = "core-ktx",                      version.ref = "coreKtx" }
androidx-appcompat          = { group = "androidx.appcompat",           name = "appcompat",                     version.ref = "appcompat" }
material                    = { group = "com.google.android.material",  name = "material",                      version.ref = "material" }
compose-bom                 = { group = "androidx.compose",             name = "compose-bom",                   version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",          name = "ui" }
compose-ui-graphics         = { group = "androidx.compose.ui",          name = "ui-graphics" }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",          name = "ui-tooling-preview" }
compose-ui-tooling          = { group = "androidx.compose.ui",          name = "ui-tooling" }
compose-ui-test-manifest    = { group = "androidx.compose.ui",          name = "ui-test-manifest" }
compose-ui-test-junit4      = { group = "androidx.compose.ui",          name = "ui-test-junit4" }
compose-material3           = { group = "androidx.compose.material3",   name = "material3" }
compose-animation           = { group = "androidx.compose.animation",   name = "animation" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose            = { group = "androidx.activity",            name = "activity-compose",              version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose",   version.ref = "lifecycleViewModel" }
lifecycle-runtime-compose   = { group = "androidx.lifecycle",           name = "lifecycle-runtime-compose",     version.ref = "lifecycleViewModel" }
navigation-compose          = { group = "androidx.navigation",          name = "navigation-compose",            version.ref = "navigationCompose" }
datastore-preferences       = { group = "androidx.datastore",           name = "datastore-preferences",         version.ref = "datastorePrefs" }
datastore                   = { group = "androidx.datastore",           name = "datastore",                     version.ref = "datastorePrefs" }
hilt-android                = { group = "com.google.dagger",            name = "hilt-android",                  version.ref = "hilt" }
hilt-compiler               = { group = "com.google.dagger",            name = "hilt-android-compiler",         version.ref = "hilt" }
hilt-navigation-compose     = { group = "androidx.hilt",                name = "hilt-navigation-compose",       version.ref = "hiltNavigationCompose" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-test",       version.ref = "coroutines" }
junit                       = { group = "junit",                        name = "junit",                         version.ref = "junit" }
androidx-junit              = { group = "androidx.test.ext",            name = "junit",                         version.ref = "junitVersion" }
androidx-espresso-core      = { group = "androidx.test.espresso",       name = "espresso-core",                 version.ref = "espressoCore" }

[plugins]
android-application  = { id = "com.android.application",              version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",         version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
hilt-android         = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
kotlin-ksp           = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
